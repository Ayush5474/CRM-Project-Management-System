&lt;script id=&quot;pms-role-capacity-estimates&quot;&gt;
// Opportunities determine headcount and estimated effort by role. Actual staff are picked in PMS.
const PRE_SALES_ROLES=[['Designer','designers'],['Frontend Developer','frontend'],['Backend Developer','backend'],['Mobile Developer','mobile'],['QA / Tester','testers'],['Coordinator','coordinators']];
function roleCounts(p){return PRE_SALES_ROLES.map(([role,key])=&gt;({role,key,count:+p[key]||0,hours:(p.slots||[]).filter(x=&gt;x.role===role).reduce((n,x)=&gt;n+(+x.hours||0),0)}))}
function ensureRolePlan(pid){let p=resourcePlan(pid);if(!Array.isArray(p.slots)){let old=Array.isArray(p.roster)?p.roster:[];p.slots=[];for(let [label,key] of PRE_SALES_ROLES){let count=+p[key]||0,prior=old.filter(x=&gt;x.role===label);for(let i=0;i&lt;count;i++)p.slots.push({role:label,hours:+(prior[i]?.hours||0)})}}p.version=p.version||1;return p;}
function totalPlanHours(p){return (p.slots||[]).reduce((n,r)=&gt;n+(+r.hours||0),0)}
function rolePlanSummary(p){let rows=roleCounts(p);return `&lt;div class=&quot;plan-summary&quot;&gt;${rows.map(x=&gt;`&lt;span&gt;&lt;b&gt;${x.role}:&lt;/b&gt; ${x.count} person(s) · ${x.hours}h&lt;/span&gt;`).join('')}&lt;b&gt;Overall: ${totalPlanHours(p)}h&lt;/b&gt;&lt;/div&gt;`}
function rolePlanChangeLog(pid){return (state.resourceChanges||[]).filter(x=&gt;x.project===pid).slice().reverse()}
function showResourceRevision(id){let c=(state.resourceChanges||[]).find(x=&gt;x.id===id);if(!c)return;const table=arr=&gt;`&lt;table class=&quot;plan-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Role&lt;/th&gt;&lt;th&gt;Position&lt;/th&gt;&lt;th&gt;Hours&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${arr.map((r,i)=&gt;`&lt;tr&gt;&lt;td&gt;${esc(r.role)}&lt;/td&gt;&lt;td&gt;${i+1}&lt;/td&gt;&lt;td&gt;${r.hours}h&lt;/td&gt;&lt;/tr&gt;`).join('')}&lt;/tbody&gt;&lt;/table&gt;`;modal(`&lt;div class=&quot;modalhead&quot;&gt;&lt;h3&gt;Resource Plan V${c.version}&lt;/h3&gt;&lt;button onclick=&quot;closeModal()&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;helper&quot;&gt;${esc(c.date)} · ${esc(c.reason)}&lt;/div&gt;&lt;h4&gt;Previous estimate&lt;/h4&gt;${table(c.before)}&lt;h4&gt;Revised estimate&lt;/h4&gt;${table(c.after)}`)}
function rolePlanHistory(pid){let changes=rolePlanChangeLog(pid);return `&lt;div class=&quot;panel card&quot;&gt;&lt;div class=&quot;statusline&quot;&gt;&lt;h3&gt;Resource Estimate Revision Log&lt;/h3&gt;&lt;span&gt;${changes.length} change(s)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Timestamp&lt;/th&gt;&lt;th&gt;Version&lt;/th&gt;&lt;th&gt;Reason&lt;/th&gt;&lt;th&gt;Old vs Revised&lt;/th&gt;&lt;th&gt;Employees Notified&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${changes.map(x=&gt;`&lt;tr&gt;&lt;td&gt;${esc(x.date)}&lt;/td&gt;&lt;td&gt;V${x.version}&lt;/td&gt;&lt;td&gt;${esc(x.reason)}&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;mini&quot; onclick=&quot;showResourceRevision('${x.id}')&quot;&gt;View Changes&lt;/button&gt;&lt;/td&gt;&lt;td&gt;${esc((x.notified||[]).join(', ')||'—')}&lt;/td&gt;&lt;/tr&gt;`).join('')||'&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;No revisions.&lt;/td&gt;&lt;/tr&gt;'}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;`}
function roleEstimateRow(x){let labels=PRE_SALES_ROLES.map(r=&gt;r[0]);return `&lt;tr&gt;&lt;td&gt;&lt;select class=&quot;plan-slot-role&quot;&gt;${labels.map(r=&gt;`&lt;option ${r===x.role?'selected':''}&gt;${r}&lt;/option&gt;`).join('')}&lt;/select&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.25&quot; class=&quot;plan-slot-hours&quot; value=&quot;${+x.hours||0}&quot; oninput=&quot;updateRolePlanTotals()&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;mini&quot; onclick=&quot;this.closest('tr').remove();updateRolePlanTotals()&quot;&gt;Remove&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;`}
function roleRowsFromEditor(){return [...document.querySelectorAll('#plan-rows tr')].map(tr=&gt;({role:tr.querySelector('.plan-slot-role').value,hours:+tr.querySelector('.plan-slot-hours').value||0}))}
function updateRolePlanTotals(){let t=document.getElementById('plan-hours-total');if(t){let a=roleRowsFromEditor(),p={slots:a};for(let [r,k] of PRE_SALES_ROLES)p[k]=a.filter(x=&gt;x.role===r).length;t.innerHTML=rolePlanSummary(p)}}
function addPlanResourceRow(){document.getElementById('plan-rows').insertAdjacentHTML('beforeend',roleEstimateRow({role:'Frontend Developer',hours:0}));updateRolePlanTotals()}
function openResourcePlan(){let p=activeTLProject(),plan=ensureRolePlan(p.id);modal(`&lt;div class=&quot;modalhead&quot;&gt;&lt;h3&gt;Pre-Sales Role &amp; Hours Estimate · ${esc(p.name)}&lt;/h3&gt;&lt;button onclick=&quot;closeModal()&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;notice&quot;&gt;Headcounts and individual role-position hours come from CRM. Actual employee selection happens only in Module-wise Assignment in PMS.&lt;/div&gt;&lt;div class=&quot;plan-controls&quot;&gt;&lt;button class=&quot;mini&quot; onclick=&quot;document.getElementById('planfile').click()&quot;&gt;Import Opportunity Estimate (JSON)&lt;/button&gt;&lt;input id=&quot;planfile&quot; type=&quot;file&quot; accept=&quot;.json,application/json&quot; hidden onchange=&quot;importOpportunityPlan(event)&quot;&gt;&lt;button class=&quot;mini&quot; onclick=&quot;addPlanResourceRow()&quot;&gt;+ Add Role Position&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;tablewrap&quot;&gt;&lt;table class=&quot;plan-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Role&lt;/th&gt;&lt;th&gt;Estimated Hours per Position&lt;/th&gt;&lt;th&gt;Action&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;plan-rows&quot;&gt;${plan.slots.map(roleEstimateRow).join('')}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div id=&quot;plan-hours-total&quot;&gt;${rolePlanSummary(plan)}&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Reason for revised estimate&lt;/label&gt;&lt;textarea id=&quot;plan-reason&quot; placeholder=&quot;Required if headcount or hours are updated&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;primary&quot; onclick=&quot;saveResourcePlan()&quot;&gt;Save Revision &amp; Notify&lt;/button&gt;&lt;/div&gt;`)}
function saveResourcePlan(){let pid=activeTLProject().id,p=ensureRolePlan(pid),before=JSON.parse(JSON.stringify(p.slots)),after=roleRowsFromEditor();if(!after.length||after.some(x=&gt;!(x.hours&gt;0))){alert('Set positive estimated hours for each required position.');return}if(JSON.stringify(before)===JSON.stringify(after)){closeModal();return}let reason=document.getElementById('plan-reason').value.trim();if(!reason){alert('Enter a reason for the revision.');return}let next={...p,slots:after};for(let [name,key] of PRE_SALES_ROLES)next[key]=after.filter(x=&gt;x.role===name).length;let modules=getProjectModules(pid);let used=projectResourceUsage(pid,{id:'__none__',lead:'',support:[],testers:[],designers:[],coordinator:''});let maxDev=next.frontend+next.backend+next.mobile;if(used.developers&gt;maxDev||used.testers&gt;next.testers||used.designers&gt;next.designers||used.coordinators&gt;next.coordinators){alert('The revised headcount is lower than current assignment usage. Reassign modules before reducing capacity.');return}Object.assign(p,next,{version:(p.version||1)+1,designHours:after.filter(x=&gt;x.role==='Designer').reduce((a,b)=&gt;a+b.hours,0),developmentHours:after.filter(x=&gt;x.role!=='Designer').reduce((a,b)=&gt;a+b.hours,0)});let notified=[...new Set(modules.flatMap(m=&gt;[m.lead,...(m.support||[]),...(m.testers||[]),...(m.designers||[]),m.coordinator].filter(Boolean)))];state.resourceChanges=state.resourceChanges||[];state.resourceChanges.push({id:'RP-'+Date.now(),project:pid,version:p.version,date:stamp(),reason,before,after,notified});state.employeeNotifications=state.employeeNotifications||[];for(let employee of notified)state.employeeNotifications.push({employee,project:pid,date:stamp(),message:`Role estimate V${p.version} updated for ${activeTLProject().name}. ${reason}`,seen:false});event('Pre-sales estimate revised',`${pid} · V${p.version} · ${reason}`);save();closeModal();render();alert('Estimate revised. Assigned employees have been notified in the prototype.');}
function importOpportunityPlan(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=&gt;{try{let payload=JSON.parse(r.result);if(!['atmora-presales-resource-v2','atmora-presales-resource-v1'].includes(payload.schema))throw Error('Invalid estimate file');let slots=[...(payload.design?.roster||[]).map(x=&gt;({role:'Designer',hours:+x.hours||0})),...(payload.it?.roster||[]).map(x=&gt;({role:({frontend:'Frontend Developer',backend:'Backend Developer',mobile:'Mobile Developer',testers:'QA / Tester',coord:'Coordinator'})[x.role]||x.role,hours:+x.hours||0}))];if(!slots.length)throw Error('No role positions were exported');document.getElementById('plan-rows').innerHTML=slots.map(roleEstimateRow).join('');document.getElementById('plan-reason').value=`Import of revised estimates from ${payload.opportunityId}`;updateRolePlanTotals();alert('Role counts and hours imported. Employee names will be selected later in module assignments.')}catch(err){alert('Import failed: '+err.message)}};r.readAsText(f)}
// Restore directory-based employee selection and count-only headcount validation.
validateProjectResources=function(pid,candidate){let p=ensureRolePlan(pid),usage=projectResourceUsage(pid,candidate),limits={developers:(+p.frontend||0)+(+p.backend||0)+(+p.mobile||0),testers:+p.testers||0,designers:+p.designers||0,coordinators:+p.coordinators||0};for(let key in limits)if(usage[key]&gt;limits[key])return `Approved pre-sales estimate allows ${limits[key]} ${key}; you selected ${usage[key]} distinct employees.`;return ''};
openModule=function(id){oldOpenModule(id);let m=tlModules().find(x=&gt;x.id===id);if(!m)return;let p=ensureRolePlan(activeTLProject().id),modalEl=document.querySelector('.modal');if(!modalEl)return;modalEl.insertAdjacentHTML('afterbegin',`&lt;div class=&quot;resource-summary&quot;&gt;&lt;b&gt;Approved Pre-Sales Headcounts&lt;/b&gt;&lt;div&gt;Developers: ${(+p.frontend||0)+(+p.backend||0)+(+p.mobile||0)} • Testers: ${p.testers} • Coordinators: ${p.coordinators}&lt;/div&gt;&lt;small&gt;Choose actual employees here in PMS; only the number of distinct employees is limited.&lt;/small&gt;&lt;/div&gt;`);const selector='';if(selector)modalEl.querySelector('.actions')?.insertAdjacentHTML('beforebegin',selector)};
const originalSaveModuleWithHours=originalSaveModule;
saveModule=function(){let pid=activeTLProject().id,m=tlModules().find(x=&gt;x.id===selectedModule);if(!m)return;let candidate={...m,lead:document.getElementById('m-lead').value,coordinator:document.getElementById('m-coord').value,support:[...document.querySelectorAll('input[name=support]:checked')].map(x=&gt;x.value),testers:[...document.querySelectorAll('input[name=testers]:checked')].map(x=&gt;x.value),designers:(m.designers||[])};let err=validateProjectResources(pid,candidate);if(err){alert(err);return}let plan=ensureRolePlan(pid),budget=plan.developmentHours||totalPlanHours(plan)-plan.designHours;let proposedHours=+document.getElementById('m-hours')?.value||0,aggregate=getProjectModules(pid).reduce((sum,x)=&gt;sum+(x.id===selectedModule?proposedHours:(+x.hours||0)),0);if(aggregate&gt;budget+1e-8){alert(`Total module estimates ${aggregate}h exceed approved IT effort ${budget}h.`);return}originalSaveModuleWithHours();m.designers=candidate.designers;save()};
const preRoleTlDetail=tlProjectDetail;
tlProjectDetail=function(){let html=preRoleTlDetail(),p=activeTLProject(),plan=ensureRolePlan(p.id);let btn=`&lt;div class=&quot;plan-controls&quot;&gt;&lt;button class=&quot;mini&quot; onclick=&quot;openResourcePlan()&quot;&gt;View / Import Role-wise Pre-Sales Estimate&lt;/button&gt;&lt;span class=&quot;helper&quot;&gt;Estimate V${plan.version} · ${plan.slots.length} positions · ${totalPlanHours(plan)}h&lt;/span&gt;&lt;/div&gt;`;html=html.replace('&lt;h3&gt;Module-wise Assignment&lt;/h3&gt;','&lt;h3&gt;Module-wise Assignment&lt;/h3&gt;'+btn);return html+rolePlanHistory(p.id)};

&lt;/script&gt;&lt;script&gt;/* After-sales internal costing: internal approval linked to client ticket, not client-facing */
(function(){
function ticketCost(t){return t.internalCost||(t.internalCost={workingDays:22,overhead:15,contingency:5,rows:[{role:'Developer',count:1,monthly:0,allocation:100,days:2},{role:'Tester',count:1,monthly:0,allocation:100,days:1},{role:'Coordinator',count:1,monthly:0,allocation:25,days:2}],status:'Not Prepared',history:[],reason:''})}

function money(n){return '₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function addCostAction(id){const root=document.querySelector('.modal');if(!root||root.querySelector('.ticket-cost-action'))return;const btn=document.createElement('div');btn.className='actions ticket-cost-action';btn.innerHTML=`&lt;button onclick=&quot;openTicketInternalCost('${id}')&quot;&gt;Internal Costing / Paid Change Review&lt;/button&gt;`;root.appendChild(btn)}

window.openTicketInternalCost=function(id){const t=state.tickets.find(x=&gt;x.id===id);if(!t)return;const c=ticketCost(t),x=sumCost(c);modal(`&lt;div class=&quot;modalhead&quot;&gt;&lt;h3&gt;Internal Costing · ${esc(t.id)}&lt;/h3&gt;&lt;button onclick=&quot;closeModal()&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;helper&quot;&gt;${esc(t.client)} · ${esc(t.project)} · ${esc(t.kind)}. Internal-use only. Warranty-covered work can still have an internal cost without being billable.&lt;/p&gt;&lt;div class=&quot;cost-ticket-status&quot;&gt;${pill(c.status)} · Internal total ${money(x.total)} · Quoted to client ${money(t.quote||0)}&lt;/div&gt;&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Role&lt;/th&gt;&lt;th&gt;Count&lt;/th&gt;&lt;th&gt;Monthly cost (₹)&lt;/th&gt;&lt;th&gt;Allocation %&lt;/th&gt;&lt;th&gt;Days&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${c.rows.map((r,i)=&gt;`&lt;tr&gt;&lt;td&gt;${esc(r.role)}&lt;/td&gt;${['count','monthly','allocation','days'].map(k=&gt;`&lt;td&gt;&lt;input class=&quot;tc-row&quot; data-i=&quot;${i}&quot; data-k=&quot;${k}&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.5&quot; value=&quot;${r[k]}&quot;&gt;&lt;/td&gt;`).join('')}&lt;/tr&gt;`).join('')}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;cost-ticket-params&quot;&gt;&lt;label&gt;Working days/month&lt;input id=&quot;tc-days&quot; type=&quot;number&quot; min=&quot;1&quot; value=&quot;${c.workingDays}&quot;&gt;&lt;/label&gt;&lt;label&gt;Overhead %&lt;input id=&quot;tc-overhead&quot; type=&quot;number&quot; min=&quot;0&quot; value=&quot;${c.overhead}&quot;&gt;&lt;/label&gt;&lt;label&gt;Contingency %&lt;input id=&quot;tc-contingency&quot; type=&quot;number&quot; min=&quot;0&quot; value=&quot;${c.contingency}&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Costing / Revision Reason&lt;/label&gt;&lt;textarea id=&quot;tc-reason&quot; placeholder=&quot;Required for saving or resubmitting the cost estimate&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button onclick=&quot;saveTicketCost('${id}',false)&quot;&gt;Save Costing&lt;/button&gt;&lt;button class=&quot;primary&quot; onclick=&quot;saveTicketCost('${id}',true)&quot;&gt;Submit to IT Sales Head&lt;/button&gt;&lt;/div&gt;&lt;h4&gt;Cost and Approval History&lt;/h4&gt;&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Action&lt;/th&gt;&lt;th&gt;Internal cost&lt;/th&gt;&lt;th&gt;Remarks&lt;/th&gt;&lt;/tr&gt;${c.history.map(h=&gt;`&lt;tr&gt;&lt;td&gt;${esc(h.at)}&lt;/td&gt;&lt;td&gt;${esc(h.action)}&lt;/td&gt;&lt;td&gt;${money(h.cost)}&lt;/td&gt;&lt;td&gt;${esc(h.reason)}&lt;/td&gt;&lt;/tr&gt;`).join('')||'&lt;tr&gt;&lt;td colspan=&quot;4&quot;&gt;No history&lt;/td&gt;&lt;/tr&gt;'}&lt;/table&gt;&lt;/div&gt;`)};
window.saveTicketCost=function(id,submit){const t=state.tickets.find(x=&gt;x.id===id),c=ticketCost(t);let reason=document.getElementById('tc-reason').value.trim();if(!reason)return alert('Enter costing reason / revision remarks');if(c.status==='Approved'&amp;&amp;submit)return alert('Approved costing cannot be resubmitted without reopening');document.querySelectorAll('.tc-row').forEach(e=&gt;{c.rows[+e.dataset.i][e.dataset.k]=Math.max(0,+e.value||0)});c.workingDays=+document.getElementById('tc-days').value||22;c.overhead=+document.getElementById('tc-overhead').value||0;c.contingency=+document.getElementById('tc-contingency').value||0;if(c.rows.some(r=&gt;r.allocation&gt;100))return alert('Allocation must be at most 100%');c.status=submit?'Pending IT Sales Approval':'Draft';c.history.push({at:stamp(),action:submit?'Submitted for Approval':'Costing Saved',cost:sumCost(c).total,reason});t.notes.unshift(`${stamp()} · IT Team Lead · Internal costing ${c.status}`);event('Internal Ticket Costing',`${id}: ${c.status}`);closeModal();render();alert(submit?'Internal costing submitted to IT Sales Head':'Internal costing saved')};

    nav.innerHTML=Object.entries(sectionNames).map(([id,name])=&gt;`&lt;button class=&quot;tab ${section===id?'active':''}&quot; onclick=&quot;openTLWorkspaceSection('${id}')&quot;&gt;${name}${id==='deviations'&amp;&amp;pending?' ('+pending+')':''}&lt;/button&gt;`).join('');
  };
  const previousRender=render;
  render=function(){previousRender();if(role==='tl'&amp;&amp;!tlSelectedProject)renderTLWorkspace();};
  renderTLWorkspace();
})();
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;
