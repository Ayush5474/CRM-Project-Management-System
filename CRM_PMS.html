function refreshEstimateTotals(){let total=readRoleSlots().reduce((sum,r)=&gt;sum+r.hours,0),h=document.querySelector('[data-key=&quot;hours&quot;]');if(h)h.value=total;let t=document.getElementById('est-total');if(t)t.innerHTML=`&lt;b&gt;Required positions:&lt;/b&gt; ${readRoleSlots().length} &amp;nbsp; &lt;b&gt;Total estimated hours:&lt;/b&gt; ${total.toFixed(2)}h`}
function refreshRoleSlots(){let o=get(),kind=state.role,d=o.estimate[kind],prev=readRoleSlots();let rows=[];for(let [name,key] of estimateRoles[kind]){let n=Math.max(0,Math.min(30,+document.querySelector(`[data-key=&quot;${key}&quot;]`)?.value||0)),old=prev.filter(x=&gt;x.role===key);for(let i=0;i&lt;n;i++)rows.push(old[i]||{role:key,hours:0});}d.roster=rows;render();toast('Role positions refreshed. Enter estimated hours for each position.');}
estimation=function(o){let html=originalEstimation(o),kind=state.role;if(!['Design','IT'].includes(kind)||o.request[kind]==='Not Requested')return html;return html.replace('&lt;div class=&quot;actions&quot;&gt;&lt;button onclick=&quot;saveEstimate',estimateSlotTable(o,kind)+'&lt;div class=&quot;actions&quot;&gt;&lt;button onclick=&quot;saveEstimate')};
saveEstimate=function(kind,submit){let o=get(),d=o.estimate[kind],slots=readRoleSlots(),total=slots.reduce((n,r)=&gt;n+r.hours,0);if(submit&amp;&amp;(!slots.length||slots.some(r=&gt;r.hours&lt;=0))){toast('Enter positive estimated hours for each required role position');return}let before=JSON.stringify(d.roster||[]);d.roster=slots;let h=document.querySelector('[data-key=&quot;hours&quot;]');if(h)h.value=total;originalSaveEstimate(kind,submit);if(before!==JSON.stringify(slots))log(o,'Role Hours Updated',`${kind}: ${slots.length} unnamed positions, ${total} overall hours`);if(submit){try{localStorage.setItem('atmora_presales_resource_plan_bridge',JSON.stringify(exportPlanPayload(o)))}catch(e){}}};
function syncRoleSlotsWithoutRefresh(){
 const table=document.getElementById('role-rows');if(!table||!['Design','IT'].includes(state.role))return;
 const prev=readRoleSlots(),rows=[];
 for(const [name,key] of estimateRoles[state.role]){
  const n=Math.max(0,Math.min(30,Number(document.querySelector(`[data-key=&quot;${key}&quot;]`)?.value)||0));
  const existing=prev.filter(r=&gt;r.role===key);
  for(let i=0;i&lt;n;i++)rows.push(existing[i]||{role:key,hours:0});
 }
 table.innerHTML=rows.map((r,i)=&gt;`&lt;tr data-role=&quot;${r.role}&quot;&gt;&lt;td&gt;${i+1}&lt;/td&gt;&lt;td&gt;${esc(estimateRoles[state.role].find(x=&gt;x[1]===r.role)?.[0]||r.role)}&lt;/td&gt;&lt;td&gt;${r.role.toUpperCase()}-${i+1}&lt;/td&gt;&lt;td&gt;&lt;input class=&quot;est-hours&quot; data-i=&quot;${i}&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.25&quot; value=&quot;${r.hours}&quot; oninput=&quot;refreshEstimateTotals()&quot;&gt;&lt;/td&gt;&lt;/tr&gt;`).join('');
 refreshEstimateTotals();
}
document.addEventListener('change',e=&gt;{if(!['Design','IT'].includes(state.role))return;if(estimateRoles[state.role].some(([,key])=&gt;e.target?.dataset?.key===key))syncRoleSlotsWithoutRefresh();});
function exportPlanPayload(o){let strip=d=&gt;({...d,roster:(d.roster||[]).map(r=&gt;({role:r.role,hours:+r.hours||0}))});return {schema:'atmora-presales-resource-v2',source:'CRM Opportunity',opportunityId:o.id,client:o.client,projectName:o.project,design:strip(o.estimate.Design),it:strip(o.estimate.IT),updatedAt:new Date().toISOString()};}

t;/b&gt;&lt;/span&gt;&lt;span&gt;Project Manager: &lt;b&gt;Ayush Gunjal&lt;/b&gt;&lt;/span&gt;&lt;span&gt;Priority: &lt;b&gt;High&lt;/b&gt;&lt;/span&gt;&lt;span&gt;Start: &lt;b&gt;2026-06-10&lt;/b&gt;&lt;/span&gt;&lt;span&gt;Target: &lt;b&gt;2026-11-30&lt;/b&gt;&lt;/span&gt;&lt;span&gt;Health: &lt;span class=&quot;pill green&quot;&gt;On Track&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;stagebar&quot; id=&quot;stagebar&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;nav class=&quot;panel tabs&quot; id=&quot;tabs&quot;&gt;&lt;/nav&gt;&lt;section id=&quot;content&quot;&gt;&lt;/section&gt;&lt;/main&gt;&lt;div id=&quot;modalroot&quot;&gt;&lt;/div&gt;

const KEY='pms-projects-handover-demo-v4';const STAGES=['Created','Documentation','Doc Approval','Design','Design Approval','IT Handover','Development','UAT','Completed'];const employees=['Ashish Chawan','Neeraj Chaudhary','Sachin Shinde','Atharv Thakur','Prathamesh Labdhe','Priyanshi Upadhyay','Tejal Nyaynit','Omkar Chavan','Siya Dudhe','Bhagyashri Patil','Shivraj Shingan','Mitesh Shetye','Anuja Chavan','Sumith Kulal','Aakansha Gawade','Pinky Kumari Bind','Ajay Gaikwad','Sarthak Zaware','Minal Kasbe','Sonali Koli','Pravin Kadam','Nageshvar Bind','Mayur Chandanshive','Harshita Shukla','Asheesh Vishwakarma','Omkar Pawar','Neha Yadav'];const seed={handover:{date:'',tl:'Ashish Chawan',priority:'High',scope:'Scrap Management System',doc:'Not yet approved',design:'Not yet approved',notes:'',link:'',devstatus:'Handover Pending',submitted:false},uat:{owner:'Aditya Vikas Telavane',type:'',start:'',target:'',build:'',url:'',status:'Not Started',comments:''},modules:[{id:'M01',name:'User &amp; Role Management',desc:'Access control, employee access and permissions',weight:15,priority:'High',source:'Feature Document',lead:'',support:[],testers:[],coordinator:'',hours:0,start:'',deadline:'',state:'Not Assigned'},{id:'M02',name:'Scrap Inward &amp; Inventory',desc:'Material inward, stock balance and stock ledger',weight:30,priority:'Critical',source:'Feature Document',lead:'',support:[],testers:[],coordinator:'',hours:0,start:'',deadline:'',state:'Not Assigned'},{id:'M03',name:'Scrap Dispatch',desc:'Dispatch, vehicle and outward transactions',weight:20,priority:'High',source:'Feature Document',lead:'',support:[],testers:[],coordinator:'',hours:0,start:'',deadline:'',state:'Not Assigned'},{id:'M04',name:'Approvals &amp; Workflow',desc:'Approval rules and transaction controls',weight:20,priority:'High',source:'Feature Document',lead:'',support:[],testers:[],coordinator:'',hours:0,start:'',deadline:'',state:'Not Assigned'},{id:'M05',name:'Reports &amp; Dashboard',desc:'Management reports, exports and dashboards',weight:15,priority:'Medium',source:'Feature Document',lead:'',support:[],testers:[],coordinator:'',hours:0,start:'',deadline:'',state:'Not Assigned'}],logs:[],deviations:[],uatIssues:[],tickets:[{id:'AS-001',project:'PRJ-2026-07',client:'Metso India Pvt. Ltd.',subject:'Stock report calculation issue',kind:'Unclassified',date:'2026-10-29',description:'Client reports a mismatch in stock summary totals.',status:'New',assignee:'',hours:0,quote:0,clientApproved:false,notes:[]}],events:[],goLive:{deployed:false,date:'',approval:false},docs:[{name:'Metso_Scrap_Management_System_FRD_V2.0',category:'Documentation',version:'V2',by:'Jitesh Yadav',date:'15-10-2026',status:'Pending',final:'Yes'}]};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){state=structuredClone(seed)};let role='tl',tab='Projects Inbox',selectedModule=null,selectedTicket=null,selectedEmployee='Ashish Chawan',tlSelectedProject=null,tlSearch='',tlStatusFilter='All';const tlProjects=[{id:'PRJ-2026-07',name:'Scrap Management System',client:'Metso India Pvt. Ltd.',manager:'Ayush Gunjal',priority:'High',target:'2026-11-30',lead:'Ashish Chawan',status:'Handover Pending'},{id:'PRJ-2026-04',name:'DC Dyes Inventory Software',client:'D C Dyes and Pigments Pvt Ltd',manager:'Ayush Gunjal',priority:'High',target:'2026-10-30',lead:'Ashish Chawan',status:'Handover Received'},{id:'PRJ-2026-06',name:'Mining Operation Management System',client:'AAC Mining Executors India Limited',manager:'Ayush Gunjal',priority:'Medium',target:'2026-11-30',lead:'Ashish Chawan',status:'Handover Awaiting Approval'}];
function activeTLProject(){return tlProjects.find(p=&gt;p.id===(tlSelectedProject||'PRJ-2026-07'))||tlProjects[0]}
function tlHandover(){if(activeTLProject().id==='PRJ-2026-07')return state.handover;return state.tlAdditional[activeTLProject().id].handover}
function tlModules(){if(activeTLProject().id==='PRJ-2026-07')return state.modules;return state.tlAdditional[activeTLProject().id].modules}
function ensureTLExtras(){if(!state.tlAdditional)state.tlAdditional={};for(const p of tlProjects.slice(1)){if(!state.tlAdditional[p.id]){state.tlAdditional[p.id]={handover:{date:'',tl:p.lead,priority:p.priority,scope:p.name,doc:'Not yet approved',design:'Not yet approved',notes:'',link:'',devstatus:p.status,submitted:false},modules:[{id:p.id+'-M01',name:'User Management',desc:'Scope from Feature Document (illustrative)',weight:25,priority:'High',source:'Feature Document',lead:'',support:[],testers:[],coordinator:'',hours:0,start:'',deadline:'',state:'Not Assigned'},{id:p.id+'-M02',name:'Core Operations',desc:'Scope from Feature Document (illustrative)',weight:45,priority:'High',source:'Feature Document',lead:'',support:[],testers:[],coordinator:'',hours:0,start:'',deadline:'',state:'Not Assigned'},{id:p.id+'-M03',name:'Reports &amp; Dashboard',desc:'Scope from Feature Document (illustrative)',weight:30,priority:'Medium',source:'Feature Document',lead:'',support:[],testers:[],coordinator:'',hours:0,start:'',deadline:'',state:'Not Assigned'}]}}}save()}
ensureTLExtras();function save(){localStorage.setItem(KEY,JSON.stringify(state))}function stamp(){return new Date().toLocaleString('en-IN')}function event(action,description){state.events.unshift({when:stamp(),who:role,action,description});save()}function esc(v){return String(v??'').replace(/[&amp;&lt;&gt;&quot;']/g,c=&gt;({'&amp;':'&amp;amp;','&lt;':'&amp;lt;','&gt;':'&amp;gt;','&quot;':'&amp;quot;',&quot;'&quot;:'&amp;#39;'}[c]))}function opts(arr,v='',placeholder='Select'){return `&lt;option value=&quot;&quot;&gt;${placeholder}&lt;/option&gt;`+arr.map(x=&gt;`&lt;option ${String(x)===String(v)?'selected':''} value=&quot;${esc(x)}&quot;&gt;${esc(x)}&lt;/option&gt;`).join('')}function field(id,label,value='',type='text',extra=''){return `&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;${id}&quot;&gt;${label}&lt;/label&gt;&lt;input id=&quot;${id}&quot; type=&quot;${type}&quot; value=&quot;${esc(value)}&quot; ${extra}&gt;&lt;/div&gt;`}function select(id,label,arr,v){return `&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;${id}&quot;&gt;${label}&lt;/label&gt;&lt;select id=&quot;${id}&quot;&gt;${opts(arr,v)}&lt;/select&gt;&lt;/div&gt;`}function box(title,body,sub=''){return `&lt;div class=&quot;panel card&quot;&gt;&lt;h3&gt;${title}&lt;/h3&gt;${sub?`&lt;p class=&quot;sub&quot;&gt;${sub}&lt;/p&gt;`:''}${body}&lt;/div&gt;`}function pill(x){let c=/approved|completed|passed|closed|resolved|submitted|verified|go live/i.test(x)?'green':/pending|draft|progress|testing|waiting|requested|review|new/i.test(x)?'amber':/rejected|blocked|failed|overdue|rework/i.test(x)?'red':'';return `&lt;span class=&quot;pill ${c}&quot;&gt;${esc(x)}&lt;/span&gt;`}function roleName(){return ({pm:'Project Manager',tl:'IT Team Lead',employee:'Developer / Tester',sales:'IT Sales Head',client:'Client Service Desk'})[role]}function switchRole(v){role=v;tlSelectedProject=null;tab=({pm:'IT Handover',tl:'Projects Inbox',employee:'My Work',sales:'Deviation Approvals',client:'After-Sales Services'})[v];render()}function showList(){if(role==='tl'){tlSelectedProject=null;tab='Projects Inbox';render()}else alert('Project list navigation is outside this focused prototype. Project PRJ-2026-07 remains open.')}function render(){document.getElementById('role').value=role;if(role==='tl'){renderTLWorkspace();return}document.querySelector('.pagehead h1').textContent='Project Details';document.querySelector('.crumb').textContent='⌂  Home / Project Management / PRJ-2026-07';document.querySelector('.project').style.display='';document.getElementById('stagebar').innerHTML=STAGES.map((x,i)=&gt;`&lt;div class=&quot;stage ${i&lt;4?'passed':''} ${i===5?'active':''}&quot;&gt;&lt;div class=&quot;circle&quot;&gt;${i+1}&lt;/div&gt;${x}&lt;/div&gt;`).join('');const available=['Overview','Pre-Sales &amp; Opportunity','Assignments','Documents &amp; Designs','Approvals','IT Handover','Development','UAT','Timeline &amp; History','After-Sales Services'];const allowed=role==='employee'?['My Work','Development']:role==='sales'?['Deviation Approvals','Timeline &amp; History']:role==='client'?['After-Sales Services']:available; if(!allowed.includes(tab))tab=allowed[0];document.getElementById('tabs').innerHTML=allowed.map(x=&gt;`&lt;button class=&quot;tab ${x===tab?'active':''}&quot; onclick=&quot;tab=${JSON.stringify(x)};render()&quot;&gt;${esc(x)}&lt;/button&gt;`).join('');document.getElementById('content').innerHTML=tab==='IT Handover'?handover():tab==='Development'?development():tab==='My Work'?myWork():tab==='Deviation Approvals'?approvals():tab==='UAT'?uatView():tab==='After-Sales Services'?afterSales():tab==='Documents &amp; Designs'?documents():tab==='Timeline &amp; History'?history():box(tab,`&lt;p class=&quot;helper&quot;&gt;The existing ${esc(tab)} tab is retained. Its detailed source data and editing functions are outside this IT handover enhancement prototype.&lt;/p&gt;`);}
function handover(){let h=state.handover;return `&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;${box('IT Handover Details',`&lt;div class=&quot;fields&quot;&gt;${field('h-id','Project ID','PRJ-2026-07','text','readonly class=&quot;readonly&quot;')}${select('h-tl','IT Team Lead',employees,h.tl)}${field('h-date','Handover Date',h.date,'date')}${select('h-priority','Priority',['High','Medium','Low','Critical'],h.priority)}&lt;div class=&quot;field wide&quot;&gt;&lt;label&gt;Final Scope Summary&lt;/label&gt;&lt;textarea id=&quot;h-scope&quot;&gt;${esc(h.scope)}&lt;/textarea&gt;&lt;/div&gt;${field('h-doc','Approved Documentation',h.doc,'text','readonly class=&quot;readonly&quot;')}${field('h-design','Approved Design',h.design,'text','readonly class=&quot;readonly&quot;')}&lt;div class=&quot;field wide&quot;&gt;&lt;label&gt;Handover Notes&lt;/label&gt;&lt;textarea id=&quot;h-notes&quot;&gt;${esc(h.notes)}&lt;/textarea&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;primary&quot; onclick=&quot;handoverSave(true)&quot;&gt;Submit IT Handover&lt;/button&gt;&lt;button onclick=&quot;handoverSave(false)&quot;&gt;Save Draft&lt;/button&gt;&lt;/div&gt;`)}&lt;/div&gt;&lt;div&gt;${box('IT Team Lead View',`&lt;div class=&quot;stub&quot;&gt;&lt;b&gt;Approved Documentation&lt;/b&gt;&lt;span class=&quot;helper&quot;&gt;${esc(h.doc)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;stub&quot;&gt;&lt;b&gt;Approved Design&lt;/b&gt;&lt;span class=&quot;helper&quot;&gt;${esc(h.design)}&lt;/span&gt;&lt;/div&gt;${field('h-link','Development Tool Link',h.link,'url')}${select('h-status','Development Status',['Handover Pending','Handover Accepted','Development In Progress','Development Completed'],h.devstatus)}&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;primary&quot; onclick=&quot;updateTLStatus()&quot;&gt;Update Status&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;notice ${h.doc==='Not yet approved'||h.design==='Not yet approved'?'warning':''}&quot; style=&quot;margin-top:12px&quot;&gt;The original documentation and design approval fields are unchanged. Handover cannot be formally accepted until both are approved.&lt;/div&gt;`)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;panel card&quot;&gt;&lt;div class=&quot;statusline&quot;&gt;&lt;div&gt;&lt;h3&gt;Module-wise Team Lead Assignment&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Modules and weightages fetched from the approved Feature Document. No re-entry of modules or weights.&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;pill&quot;&gt;${state.modules.reduce((a,m)=&gt;a+Number(m.weight),0)}% total weightage&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;notice&quot;&gt;Add a primary developer, supporting developers, testers, coordinator, estimated hours and deadlines for each module. A module can have multiple contributors, each with independent daily work logs.&lt;/div&gt;${moduleTable(true)}&lt;/div&gt;`}
function handoverSave(submit){let h=state.handover;for(let [k,id] of Object.entries({tl:'h-tl',date:'h-date',priority:'h-priority',scope:'h-scope',notes:'h-notes'}))h[k]=document.getElementById(id).value;if(submit&amp;&amp;(!h.date||h.doc==='Not yet approved'||h.design==='Not yet approved')){alert('Handover needs a date and approved documentation/design. Existing approval values have been preserved. You can save a draft.');return}h.submitted=submit;event(submit?'IT handover submitted':'Handover draft saved','PRJ-2026-07');render()}function updateTLStatus(){let h=state.handover;h.link=document.getElementById('h-link').value;let next=document.getElementById('h-status').value;if(next==='Handover Accepted'&amp;&amp;(h.doc==='Not yet approved'||h.design==='Not yet approved')){alert('Approved documentation and design are required before accepting handover.');return}h.devstatus=next;event('IT TL status updated',next);render()}
function contributors(m){return Array.from(new Set([m.lead,...m.support,...m.testers,m.coordinator].filter(Boolean)))}function moduleTable(edit){return `&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Module / Source&lt;/th&gt;&lt;th&gt;Priority / Weight&lt;/th&gt;&lt;th&gt;Primary Developer&lt;/th&gt;&lt;th&gt;Support / Testers&lt;/th&gt;&lt;th&gt;Estimated / Actual&lt;/th&gt;&lt;th&gt;Deadline&lt;/th&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Action&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${(role==='tl'?tlModules():state.modules).map(m=&gt;{let hrs=state.logs.filter(l=&gt;l.module===m.id).reduce((s,l)=&gt;s+Number(l.hours),0);return `&lt;tr&gt;&lt;td&gt;&lt;b&gt;${esc(m.name)}&lt;/b&gt;&lt;div class=&quot;helper&quot;&gt;${esc(m.id)} · ${esc(m.source)}&lt;/div&gt;&lt;div class=&quot;helper&quot;&gt;${esc(m.desc)}&lt;/div&gt;&lt;/td&gt;&lt;td&gt;${esc(m.priority)} · ${m.weight}%&lt;/td&gt;&lt;td&gt;${esc(m.lead||'Not assigned')}&lt;/td&gt;&lt;td&gt;${m.support.length} support · ${m.testers.length} testers&lt;br&gt;&lt;span class=&quot;helper&quot;&gt;${contributors(m).length} people involved&lt;/span&gt;&lt;/td&gt;&lt;td&gt;${m.hours||0}h / ${hrs}h&lt;/td&gt;&lt;td&gt;${esc(m.deadline||'—')}&lt;/td&gt;&lt;td&gt;${pill(m.state)}&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;mini&quot; onclick=&quot;openModule('${m.id}')&quot;&gt;${edit?'Assign / Edit':'View'}&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;`}).join('')}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`}
function openModule(id){let m=(role==='tl'?tlModules():state.modules).find(x=&gt;x.id===id);selectedModule=id;const check=(arr,checked)=&gt;arr.map(n=&gt;`&lt;label class=&quot;checkrow&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;${checked}&quot; value=&quot;${esc(n)}&quot; ${m[checked].includes(n)?'checked':''}&gt;${esc(n)}&lt;/label&gt;`).join('');modal(`&lt;div class=&quot;modalhead&quot;&gt;&lt;h3&gt;Module Assignment · ${esc(m.id)}&lt;/h3&gt;&lt;button onclick=&quot;closeModal()&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;notice&quot;&gt;${esc(m.name)} · ${m.weight}% project weight · Source: ${esc(m.source)} (read-only)&lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;${select('m-lead','Primary Developer',employees,m.lead)}${select('m-coord','Coordinator',employees,m.coordinator)}${field('m-hours','Estimated Total Hours',m.hours,'number','min=&quot;0&quot; step=&quot;0.5&quot;')}${field('m-start','Start Date',m.start,'date')}${field('m-deadline','Deadline',m.deadline,'date')}${select('m-state','Module Status',['Not Assigned','Assigned','In Progress','In Testing','Blocked','Verified','Completed'],m.state)}&lt;/div&gt;&lt;div class=&quot;split&quot; style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;soft&quot;&gt;&lt;b&gt;Supporting Developers&lt;/b&gt;&lt;div class=&quot;helper&quot;&gt;Select any number&lt;/div&gt;&lt;div style=&quot;max-height:128px;overflow:auto;margin-top:7px&quot;&gt;${check(employees,'support')}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;soft&quot;&gt;&lt;b&gt;Testers&lt;/b&gt;&lt;div class=&quot;helper&quot;&gt;Each tester gets own work log&lt;/div&gt;&lt;div style=&quot;max-height:128px;overflow:auto;margin-top:7px&quot;&gt;${check(employees,'testers')}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;primary&quot; onclick=&quot;saveModule()&quot;&gt;Save Module Assignment&lt;/button&gt;&lt;/div&gt;`)}function saveModule(){let m=(role==='tl'?tlModules():state.modules).find(x=&gt;x.id===selectedModule);m.lead=document.getElementById('m-lead').value;m.coordinator=document.getElementById('m-coord').value;m.hours=+document.getElementById('m-hours').value||0;m.start=document.getElementById('m-start').value;m.deadline=document.getElementById('m-deadline').value;m.state=document.getElementById('m-state').value;m.support=[...document.querySelectorAll('input[name=support]:checked')].map(x=&gt;x.value);m.testers=[...document.querySelectorAll('input[name=testers]:checked')].map(x=&gt;x.value);if(m.lead&amp;&amp;m.state==='Not Assigned')m.state='Assigned';event('Module assignment saved',`${m.id} · ${m.name} · ${contributors(m).length} contributors · ${m.hours}h`);closeModal();render()}

function logModal(id){selectedModule=id;let m=state.modules.find(x=&gt;x.id===id);modal(`&lt;div class=&quot;modalhead&quot;&gt;&lt;h3&gt;Daily Update · ${esc(m.name)}&lt;/h3&gt;&lt;button onclick=&quot;closeModal()&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;${field('l-date','Work Date',new Date().toISOString().slice(0,10),'date')}${field('l-person','Employee',selectedEmployee,'text','readonly class=&quot;readonly&quot;')}${field('l-hours','Actual Hours Today','','number','min=&quot;0.25&quot; max=&quot;24&quot; step=&quot;0.25&quot;')}${field('l-prog','My Assigned Portion Progress (%)','','number','min=&quot;0&quot; max=&quot;100&quot;')}${select('l-status','Status',['In Progress','Blocked','Ready for Testing','Testing','Ready for TL Review'], 'In Progress')}&lt;div class=&quot;field wide&quot;&gt;&lt;label&gt;Work Completed Today&lt;/label&gt;&lt;textarea id=&quot;l-work&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;field wide&quot;&gt;&lt;label&gt;Blocker / Delay Reason&lt;/label&gt;&lt;textarea id=&quot;l-blocker&quot; placeholder=&quot;Required if status is Blocked&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;helper&quot;&gt;Hours are totalled per employee and module; a contributor's progress does not automatically become the overall module progress.&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;primary&quot; onclick=&quot;saveLog()&quot;&gt;Save Daily Work Log&lt;/button&gt;&lt;/div&gt;`)}function saveLog(){let v=id=&gt;document.getElementById(id).value;let hours=+v('l-hours'),progress=+v('l-prog');if(!v('l-date')||!(hours&gt;0&amp;&amp;hours&lt;=24)||progress&lt;0||progress&gt;100||!v('l-work').trim()){alert('Enter date, hours (0.25–24), progress (0–100) and work completed.');return}if(v('l-status')==='Blocked'&amp;&amp;!v('l-blocker').trim()){alert('Blocker reason is required.');return}state.logs.push({id:'WL-'+Date.now(),module:selectedModule,date:v('l-date'),person:sele function deviationModal(id){selectedModule=id;let m=state.modules.find(x=&gt;x.id===id);modal(`&lt;div class=&quot;modalhead&quot;&gt;&lt;h3&gt;Request Effort / Deadline Deviation&lt;/h3&gt;&lt;button onclick=&quot;closeModal()&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;notice&quot;&gt;Module ${esc(id)} · ${esc(m.name)}. Original approved estimate and deadline remain unchanged until IT Sales Head approval.&lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;${field('d-from','Requested By',selectedEmployee,'text','readonly class=&quot;readonly&quot;')}${field('d-oldhours','Original Estimated Hours',m.hours,'number','readonly class=&quot;readonly&quot;')}${field('d-olddate','Current Deadline',m.deadline,'text','readonly class=&quot;readonly&quot;')}${field('d-newhours','Requested Revised Total Hours',m.hours,'number','min=&quot;0&quot; step=&quot;0.5&quot;')}${field('d-newdate','Requested New Deadline',m.deadline,'date')}&lt;div class=&quot;field wide&quot;&gt;&lt;label&gt;Reason / Justification (mandatory)&lt;/label&gt;&lt;textarea id=&quot;d-reason&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;primary&quot; onclick=&quot;sendDeviation()&quot;&gt;Submit to IT Sales Head&lt;/button&gt;&lt;/div&gt;`)}function sendDeviation(){let m=state.modules.find(x=&gt;x.id===selectedModule),v=id=&gt;document.getElementById(id).value;let hours=+v('d-newhours');if(!v('d-reason').trim()||!v('d-newdate')||hours&lt;=0){alert('Fill requested hours, deadline and mandatory reason.');return}state.deviations.push({id:'DEV-'+String(state.deviations.length+1).padStart(3,'0'),module:m.id,person:selectedEmployee,oldhours:m.hours,olddate:m.deadline,newhours:hours,newdate:v('d-newdate'),reason:v('d-reason'),status:'Pending IT Sales Head',decidedBy:'',remark:'',created:stamp()});event('Deviation requested',`${selectedEmployee} · ${m.id} · ${v('d-reason')}`);closeModal();render()}

function reviewDeviation(id){let d=state.deviations.find(x=&gt;x.id===id);modal(`&lt;div class=&quot;modalhead&quot;&gt;&lt;h3&gt;Deviation Review · ${esc(d.id)}&lt;/h3&gt;&lt;button onclick=&quot;closeModal()&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;soft&quot;&gt;&lt;b&gt;${esc(d.module)} · ${esc(d.person)}&lt;/b&gt;&lt;p&gt;Reason: ${esc(d.reason)}&lt;/p&gt;&lt;p&gt;Original: ${d.oldhours}h / ${esc(d.olddate||'—')} → Requested: ${d.newhours}h / ${esc(d.newdate)}&lt;/p&gt;&lt;p&gt;Current status: ${pill(d.status)}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;field&quot; style=&quot;margin-top:12px&quot;&gt;&lt;label&gt;Review Remarks&lt;/label&gt;&lt;textarea id=&quot;decision-note&quot; placeholder=&quot;Reason for approval or rejection&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;${d.status==='Pending IT Sales Head'?`&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;blue&quot; onclick=&quot;decideDeviation('${id}','Approved')&quot;&gt;Approve&lt;/button&gt;&lt;button onclick=&quot;decideDeviation('${id}','Rejected')&quot;&gt;Reject&lt;/button&gt;&lt;/div&gt;`:''}`)}function decideDeviation(id,outcome){let d=state.deviations.find(x=&gt;x.id===id),note=document.getElementById('decision-note').value.trim();if(!note){alert('Approval or rejection remarks are mandatory.');return}d.status=outcome;d.remark=note;d.decidedBy='IT Sales Head';d.decidedAt=stamp();if(outcome==='Approved'){let m=state.modules.find(m=&gt;m.id===d.module);m.hours=d.newhours;m.deadline=d.newdate;}event('Deviation '+outcome.toLowerCase(),`${d.id} · ${d.module} · ${note}. Original baseline retained in request.`);closeModal();render()}

function serviceSubmitTicket(){let type=document.getElementById('svc-type').value,subject=document.getElementById('svc-title').value.trim(),description=document.getElementById('svc-description').value.trim();if(!subject||!description){alert('Enter a subject and description.');return}let next=Math.max(0,...state.tickets.map(x=&gt;Number((x.id||'').replace(/\D/g,''))||0))+1,id='AS-'+String(next).padStart(3,'0');state.tickets.unshift({id,project:serviceProject.id,client:serviceProject.client,subject,description,type,kind:'Pending Review',date:new Date().toISOString().slice(0,10),status:'New',assignee:'',assignments:[],worklogs:[],notes:[stamp()+' · Client Service Desk · Ticket submitted'],quote:0,clientApproved:false,estimatedHours:0,warrantyFrom:serviceProject.warrantyFrom,warrantyTo:serviceProject.warrantyTo});event('Client ticket raised',id+' · '+type+' · '+subject);serviceClientTab='My Tickets';render()}
function serviceTL(){return `${serviceKPI(state.tickets)}${box('Client Tickets',`&lt;div class=&quot;statusline&quot;&gt;&lt;h3&gt;Client Tickets&lt;/h3&gt;&lt;span class=&quot;helper&quot;&gt;Client-raised requests linked to PMS projects&lt;/span&gt;&lt;/div&gt;${serviceRows(state.tickets,'tl')}`)}`}
function serviceEmployeeTickets(){let items=state.tickets.filter(t=&gt;t.assignments.some(a=&gt;a.name===serviceEmployee));return `&lt;div class=&quot;panel card&quot;&gt;&lt;div class=&quot;statusline&quot;&gt;&lt;div&gt;&lt;h3&gt;Assigned Client Tickets&lt;/h3&gt;&lt;/div&gt;&lt;div&gt;&lt;label class=&quot;helper&quot;&gt;Employee&amp;nbsp;&lt;/label&gt;&lt;select onchange=&quot;serviceEmployee=this.value;render()&quot;&gt;${opts(employees,serviceEmployee)}&lt;/select&gt;&lt;/div&gt;&lt;/div&gt;${serviceKPI(items)}${serviceRows(items,'employee')}&lt;/div&gt;`}
function serviceLogs(t){let hrs=t.worklogs.reduce((s,l)=&gt;s+Number(l.hours||0),0);return `&lt;div class=&quot;soft&quot; style=&quot;margin:12px 0&quot;&gt;&lt;b&gt;Work Summary&lt;/b&gt; &amp;nbsp; Estimated ${Number(t.estimatedHours||0)}h · Actual ${hrs}h · ${hrs&gt;Number(t.estimatedHours||0)?'&lt;span class=&quot;variance-bad&quot;&gt;Over estimate '+(hrs-Number(t.estimatedHours||0))+'h&lt;/span&gt;':`&lt;span class=&quot;variance-good&quot;&gt;Balance ${Number(t.estimatedHours||0)-hrs}h&lt;/span&gt;`}&lt;/div&gt;${t.worklogs.length?`&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Employee&lt;/th&gt;&lt;th&gt;Hours&lt;/th&gt;&lt;th&gt;Progress&lt;/th&gt;&lt;th&gt;Work Done&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${t.worklogs.map(l=&gt;`&lt;tr&gt;&lt;td&gt;${esc(l.date)}&lt;/td&gt;&lt;td&gt;${esc(l.employee)}&lt;/td&gt;&lt;td&gt;${esc(l.hours)}h&lt;/td&gt;&lt;td&gt;${esc(l.progress)}%&lt;/td&gt;&lt;td&gt;${esc(l.remarks)}&lt;/td&gt;&lt;/tr&gt;`).join('')}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`:'&lt;div class=&quot;helper&quot;&gt;No work logs yet.&lt;/div&gt;'}`}
function serviceOpen(id,actor){let t=state.tickets.find(x=&gt;x.id===id);if(!t)return;serviceTicketID=id;let summary=`&lt;div class=&quot;notice&quot;&gt;&lt;b&gt;${esc(t.id)} · ${esc(t.subject)}&lt;/b&gt;&lt;div&gt;${esc(t.client)} · ${esc(t.project)} · ${esc(t.type)} · ${pill(t.status)}&lt;/div&gt;&lt;p style=&quot;margin:8px 0 0&quot;&gt;${esc(t.description)}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;soft&quot; style=&quot;margin:12px 0&quot;&gt;&lt;b&gt;Contract / Warranty Reference&lt;/b&gt;&lt;div class=&quot;helper&quot;&gt;${esc(t.warrantyFrom)} to ${esc(t.warrantyTo)} · ${esc(serviceProject.contract)} · ${esc(serviceProject.reference)}&lt;/div&gt;&lt;div class=&quot;helper&quot;&gt;Coverage shown is an indicative contract-based check; final warranty eligibility requires TL scope verification.&lt;/div&gt;&lt;/div&gt;`;
let body='';if(actor==='client'){body=`&lt;p&gt;&lt;b&gt;Request classification:&lt;/b&gt; ${pill(t.kind)}&lt;/p&gt;&lt;p&gt;&lt;b&gt;Current status:&lt;/b&gt; ${pill(t.status)}&lt;/p&gt;${serviceLogs(t)}&lt;div class=&quot;sectionlabel&quot;&gt;Ticket Updates&lt;/div&gt;&lt;div class=&quot;audit&quot;&gt;${t.notes.map(n=&gt;`&lt;div class=&quot;audititem&quot;&gt;${esc(n)}&lt;/div&gt;`).join('')}&lt;/div&gt;`}
if(actor==='tl'){body=`&lt;div class=&quot;fields&quot;&gt;${select('svc-class','Classification',['Pending Review','Under Warranty','Paid Change'],t.kind)}${select('svc-status','Ticket Status',['New','Under Review','Awaiting Client Approval','Assigned','In Progress','In Testing','Delivered','Closed'],t.status)}${field('svc-est','Estimated Work Hours',t.estimatedHours||0,'number','min=&quot;0&quot; step=&quot;0.5&quot;')}${field('svc-quote','Paid Change Quotation (INR)',t.quote||0,'number','min=&quot;0&quot;')}&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Client Commercial Approval&lt;/label&gt;&lt;select id=&quot;svc-approved&quot;&gt;&lt;option value=&quot;no&quot; ${!t.clientApproved?'selected':''}&gt;Pending&lt;/option&gt;&lt;option value=&quot;yes&quot; ${t.clientApproved?'selected':''}&gt;Approved&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;field wide&quot;&gt;&lt;label&gt;IT TL Remarks&lt;/label&gt;&lt;textarea id=&quot;svc-note&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sectionlabel&quot;&gt;Assign Developers / Testers&lt;/div&gt;&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Employee&lt;/th&gt;&lt;th&gt;Role&lt;/th&gt;&lt;th&gt;Action&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${t.assignments.map((a,i)=&gt;`&lt;tr&gt;&lt;td&gt;${esc(a.name)}&lt;/td&gt;&lt;td&gt;${esc(a.role)}&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;mini&quot; onclick=&quot;serviceRemoveAssignee(${i})&quot;&gt;Remove&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;`).join('')||'&lt;tr&gt;&lt;td colspan=&quot;3&quot; class=&quot;empty&quot;&gt;Not assigned yet&lt;/td&gt;&lt;/tr&gt;'}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;fields&quot; style=&quot;margin-top:12px&quot;&gt;${select('svc-emp','Select Employee',employees)}${select('svc-erole','Work Role',['Developer','Supporting Developer','Tester','Coordinator'],'Developer')}&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button onclick=&quot;serviceAddAssignee()&quot;&gt;+ Add Contributor&lt;/button&gt;&lt;button class=&quot;primary&quot; onclick=&quot;serviceSaveTL()&quot;&gt;Save &amp; Assign Ticket&lt;/button&gt;&lt;/div&gt;${serviceLogs(t)}`}
if(actor==='employee'){let a=t.assignments.find(x=&gt;x.name===serviceEmployee);if(!a){alert('This ticket is not assigned to the selected employee.');return}body=`&lt;p&gt;&lt;b&gt;Your assignment:&lt;/b&gt; ${esc(a.role)}&lt;/p&gt;${serviceLogs(t)}&lt;div class=&quot;fields&quot;&gt;${field('svc-logdate','Work Date',new Date().toISOString().slice(0,10),'date')}${field('svc-loghrs','Hours Worked',0,'number','min=&quot;0.25&quot; step=&quot;0.25&quot;')}${field('svc-logprogress','My Progress %',0,'number','min=&quot;0&quot; max=&quot;100&quot;')}&lt;div class=&quot;field wide&quot;&gt;&lt;label&gt;Work Done / Testing Remarks&lt;/label&gt;&lt;textarea id=&quot;svc-logremarks&quot; rows=&quot;3&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;primary&quot; onclick=&quot;serviceSaveWork()&quot;&gt;Save Work Log&lt;/button&gt;&lt;/div&gt;`}
modal(`&lt;div class=&quot;modalhead&quot;&gt;&lt;h3&gt;${actor==='employee'?'My Client Ticket':actor==='tl'?'Review &amp; Assign Client Ticket':'My Ticket'} · ${esc(t.id)}&lt;/h3&gt;&lt;button onclick=&quot;closeModal()&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;${summary}${body}`)}
function serviceAddAssignee(){let t=state.tickets.find(x=&gt;x.id===serviceTicketID),name=document.getElementById('svc-emp').value,workrole=document.getElementById('svc-erole').value;if(!name){alert('Select an employee.');return}if(t.assignments.some(a=&gt;a.name===name)){alert('Employee already assigned.');return}t.assignments.push({name,role:workrole});event('Service contributor assigned',`${t.id} · ${name} · ${workrole}`);serviceOpen(t.id,'tl')}
function serviceRemoveAssignee(i){let t=state.tickets.find(x=&gt;x.id===serviceTicketID);let deleted=t.assignments.splice(i,1)[0];event('Service assignment removed',`${t.id} · ${deleted.name}`);serviceOpen(t.id,'tl')}
function serviceSaveTL(){let t=state.tickets.find(x=&gt;x.id===serviceTicketID),val=id=&gt;document.getElementById(id).value;let kind=val('svc-class'),status=val('svc-status'),quote=+val('svc-quote')||0,approved=val('svc-approved')==='yes';if(['Assigned','In Progress','In Testing','Delivered','Closed'].includes(status)&amp;&amp;kind==='Pending Review'){alert('Please classify warranty or paid change before assignment.');return}if(['Assigned','In Progress','In Testing','Delivered','Closed'].includes(status)&amp;&amp;!t.assignments.length){alert('Assign at least one contributor before work starts.');return}if(kind==='Paid Change'&amp;&amp;['Assigned','In Progress','In Testing','Delivered','Closed'].includes(status)&amp;&amp;(!quote||!approved)){alert('Paid change requires a quotation and recorded client commercial approval before work starts.');return}t.kind=kind;t.status=status;t.estimatedHours=+val('svc-est')||0;t.quote=quote;t.clientApproved=approved;t.assignee=t.assignments.map(a=&gt;a.name).join(', ');let note=val('svc-note').trim();t.notes.unshift(`${stamp()} · IT Team Lead · ${note||'Ticket reviewed and assignment updated'}`);event('Client ticket reviewed',t.id+' · '+kind+' · '+status);closeModal();render()}
function serviceSaveWork(){let t=state.tickets.find(x=&gt;x.id===serviceTicketID),val=id=&gt;document.getElementById(id).value,hrs=+val('svc-loghrs'),progress=+val('svc-logprogress'),remarks=val('svc-logremarks').trim(),date=val('svc-logdate');if(!date||!(hrs&gt;0)||hrs&gt;24||progress&lt;0||progress&gt;100||!remarks){alert('Enter valid work date, 0–24 hours, progress 0–100 and remarks.');return}if(!t.assignments.some(a=&gt;a.name===serviceEmployee)){alert('This work is not assigned to this employee.');return}if(t.kind==='Paid Change'&amp;&amp;!t.clientApproved){alert('Paid change is awaiting commercial approval.');return}t.worklogs.push({date,employee:serviceEmployee,hours:hrs,progress,remarks});if(t.status==='Assigned')t.status='In Progress';t.notes.unshift(`${stamp()} · ${serviceEmployee} · Logged ${hrs}h (${progress}% progress)`);event('Service work logged',`${t.id} · ${serviceEmployee} · ${hrs}h`);closeModal();render();workSavedConfirmation('client ticket work log',hrs)}
const previousRender=render;
render=function(){if(role==='client'){
  document.getElementById('role').value=role;document.querySelector('.pagehead h1').textContent='Client Service Desk';document.querySelector('.crumb').textContent='⌂  Home / Service Desk';document.querySelector('.pagehead button').style.display='none';document.querySelector('.project').style.display='none';document.getElementById('tabs').style.display='flex';document.getElementById('tabs').innerHTML=['My Tickets','Raise Ticket'].map(x=&gt;`&lt;button class=&quot;tab ${serviceClientTab===x?'active':''}&quot; onclick=&quot;serviceClientTab='${x}';render()&quot;&gt;${x}&lt;/button&gt;`).join('');document.getElementById('content').innerHTML=serviceClientTab==='Raise Ticket'?serviceRaiseView():serviceClient();return;
}if(role==='employee'&amp;&amp;tab==='Assigned Client Tickets'){
  document.getElementById('role').value=role;document.querySelector('.pagehead h1').textContent='Employee Workspace';document.querySelector('.crumb').textContent='⌂  Home / Project Management / Client Tickets';document.querySelector('.pagehead button').style.display='none';document.querySelector('.project').style.display='none';document.getElementById('tabs').style.display='flex';document.getElementById('tabs').innerHTML=['My Work','Deviation Requests','Assigned Client Tickets'].map(x=&gt;`&lt;button class=&quot;tab ${tab===x?'active':''}&quot; onclick=&quot;tab='${x}';render()&quot;&gt;${x}&lt;/button&gt;`).join('');document.getElementById('content').innerHTML=serviceEmployeeTickets();return;
}if(role==='tl'&amp;&amp;serviceTLTab==='Client Tickets'&amp;&amp;!tlSelectedProject){
  document.getElementById('role').value=role;document.querySelector('.pagehead h1').textContent='IT Team Lead – Client Tickets';document.querySelector('.crumb').textContent='⌂  Home / Project Management / Client Tickets';document.querySelector('.pagehead button').style.display='none';document.querySelector('.project').style.display='none';document.getElementById('tabs').style.display='flex';document.getElementById('tabs').innerHTML=`&lt;button class=&quot;tab&quot; onclick=&quot;serviceTLTab='Projects Inbox';render()&quot;&gt;Handover Inbox&lt;/button&gt;&lt;button class=&quot;tab active&quot;&gt;Client Tickets&lt;/button&gt;`;document.getElementById('content').innerHTML=serviceTL();return;
}
previousRender();
if(role==='tl'&amp;&amp;!tlSelectedProject){let tabs=document.getElementById('tabs');tabs.style.display='flex';tabs.innerHTML=`&lt;button class=&quot;tab active&quot; onclick=&quot;serviceTLTab='Projects Inbox';render()&quot;&gt;Handover Inbox&lt;/button&gt;&lt;button class=&quot;tab&quot; onclick=&quot;serviceTLTab='Projects Inbox';render()&quot;&gt;Client Tickets&lt;/button&gt;`}
if(role==='employee'){let tabs=document.getElementById('tabs');tabs.insertAdjacentHTML('beforeend',`&lt;button class=&quot;tab&quot; onclick=&quot;tab='Assigned Client Tickets';render()&quot;&gt;Assigned Client Tickets&lt;/button&gt;`)}
};
const previousSwitchRole=switchRole;
switchRole=function(v){previousSwitchRole(v);if(v==='client'){serviceClientTab='My Tickets'}if(v==='tl'){serviceTLTab='Projects Inbox'}if(v==='employee'){tab='My Work'}render()};

render();

&lt;script&gt;
let lastServiceSubmission='',salesDeviationSearch='',salesDeviationStatus='All';
const oldServiceSubmitTicket=serviceSubmitTicket;
serviceSubmitTicket=function(){
  const before=state.tickets.length;
  oldServiceSubmitTicket();
  if(state.tickets.length&gt;before){lastServiceSubmission=state.tickets[0].id;closeModal();serviceClientTab='My Tickets';render();}
};
const originalServiceRaiseView=serviceRaiseView;
serviceRaiseView=function(){return originalServiceRaiseView()
 .replace('Contract Coverage','Contract Coverage')
 .replace('Coverage is subject to warranty terms and review by the IT Team Lead.','Coverage is subject to warranty terms and review by the IT Team Lead.');};
function openRaiseServiceModal(){modal('&lt;div class=&quot;modalhead&quot;&gt;&lt;h3&gt;Raise Ticket&lt;/h3&gt;&lt;button onclick=&quot;closeModal()&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;'+serviceRaiseView().replace('class=&quot;panel card&quot;','class=&quot;&quot;').replace('onclick=&quot;serviceClientTab=\'My Tickets\';render()&quot;','onclick=&quot;closeModal()&quot;'))}
serviceClient=function(){
 const items=state.tickets.filter(t=&gt;t.client===serviceProject.client);
 return (lastServiceSubmission?`&lt;div class=&quot;service-success&quot; role=&quot;status&quot;&gt;&lt;b&gt;✓ Ticket submitted successfully&lt;/b&gt; · ${esc(lastServiceSubmission)} &lt;button class=&quot;mini&quot; style=&quot;float:right&quot; onclick=&quot;lastServiceSubmission='';render()&quot;&gt;Dismiss&lt;/button&gt;&lt;div&gt;Your ticket is now listed under My Tickets.&lt;/div&gt;&lt;/div&gt;`:'')+
 `${serviceKPI(items)}&lt;div class=&quot;panel card&quot;&gt;&lt;div class=&quot;service-head&quot;&gt;&lt;h3&gt;My Tickets&lt;/h3&gt;&lt;button class=&quot;primary&quot; onclick=&quot;openRaiseServiceModal()&quot;&gt;＋ Raise Ticket&lt;/button&gt;&lt;/div&gt;${serviceRows(items,'client')}&lt;/div&gt;`;
};
serviceTL=function(){
 const items=state.tickets;
 return `${serviceKPI(items)}&lt;div class=&quot;panel card&quot;&gt;&lt;div class=&quot;service-head&quot;&gt;&lt;h3&gt;Client Tickets&lt;/h3&gt;&lt;span class=&quot;pill&quot;&gt;${items.filter(t=&gt;!['Delivered','Closed'].includes(t.status)).length} Open Requests&lt;/span&gt;&lt;/div&gt;${serviceRows(items,'tl')}&lt;/div&gt;`;
};
approvals=function(){
 const all=state.deviations, pending=all.filter(d=&gt;d.status==='Pending IT Sales Head').length;
 const items=all.filter(d=&gt;{let p=tlProjects.find(p=&gt;p.id===d.project);let search=(d.id+' '+d.project+' '+(p?.client||'')+' '+(p?.name||'')+' '+d.person+' '+d.module).toLowerCase();return search.includes(salesDeviationSearch.toLowerCase())&amp;&amp;(salesDeviationStatus==='All'||d.status===salesDeviationStatus)});
 return `&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;strong&gt;${all.length}&lt;/strong&gt;&lt;span&gt;Total Deviation Requests&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;strong&gt;${pending}&lt;/strong&gt;&lt;span&gt;Pending Approval&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;strong&gt;${all.filter(d=&gt;d.status==='Approved').length}&lt;/strong&gt;&lt;span&gt;Approved&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;strong&gt;${all.filter(d=&gt;d.status==='Rejected').length}&lt;/strong&gt;&lt;span&gt;Rejected&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;panel card&quot;&gt;&lt;div class=&quot;service-head&quot;&gt;&lt;h3&gt;Deviation Approval Inbox&lt;/h3&gt;&lt;span class=&quot;pill&quot;&gt;${items.length} Requests&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;sales-filters&quot;&gt;&lt;input id=&quot;sales-search&quot; placeholder=&quot;Search company / project / employee&quot; value=&quot;${esc(salesDeviationSearch)}&quot; oninput=&quot;salesDeviationSearch=this.value;filterSalesRows()&quot;&gt;&lt;select id=&quot;sales-status&quot; onchange=&quot;salesDeviationStatus=this.value;render()&quot;&gt;${['All','Pending IT Sales Head','Approved','Rejected'].map(x=&gt;`&lt;option ${x===salesDeviationStatus?'selected':''}&gt;${esc(x)}&lt;/option&gt;`).join('')}&lt;/select&gt;&lt;/div&gt;
 &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Request ID&lt;/th&gt;&lt;th&gt;Company / Project&lt;/th&gt;&lt;th&gt;Module&lt;/th&gt;&lt;th&gt;Employee&lt;/th&gt;&lt;th&gt;Original Hours / Deadline&lt;/th&gt;&lt;th&gt;Requested Hours / Deadline&lt;/th&gt;&lt;th&gt;Reason&lt;/th&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Action&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;sales-deviation-rows&quot;&gt;${items.map(d=&gt;{let p=tlProjects.find(p=&gt;p.id===d.project);return `&lt;tr data-search=&quot;${esc((d.id+' '+d.project+' '+(p?.client||'')+' '+(p?.name||'')+' '+d.person+' '+d.module).toLowerCase())}&quot;&gt;&lt;td&gt;&lt;b&gt;${esc(d.id)}&lt;/b&gt;&lt;div class=&quot;helper&quot;&gt;${esc(d.created)}&lt;/div&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;${esc(p?.client||d.project)}&lt;/b&gt;&lt;div class=&quot;helper&quot;&gt;${esc(p?.name||d.project)}&lt;/div&gt;&lt;/td&gt;&lt;td&gt;${esc(d.module)}&lt;/td&gt;&lt;td&gt;${esc(d.person)}&lt;/td&gt;&lt;td&gt;${d.oldhours}h&lt;div class=&quot;helper&quot;&gt;${esc(d.olddate||'—')}&lt;/div&gt;&lt;/td&gt;&lt;td&gt;${d.newhours}h&lt;div class=&quot;helper&quot;&gt;${esc(d.newdate||'—')}&lt;/div&gt;&lt;/td&gt;&lt;td&gt;${esc(d.reason)}&lt;/td&gt;&lt;td&gt;${pill(d.status)}&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;mini&quot; onclick=&quot;reviewDeviation('${d.id}')&quot;&gt;Open Request&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;`}).join('')||'&lt;tr&gt;&lt;td colspan=&quot;9&quot; class=&quot;service-empty&quot;&gt;No deviation requests found.&lt;/td&gt;&lt;/tr&gt;'}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;`;
};
function filterSalesRows(){const input=document.getElementById('sales-search');salesDeviationSearch=input.value.toLowerCase();document.querySelectorAll('#sales-deviation-rows tr[data-search]').forEach(row=&gt;row.style.display=row.dataset.search.includes(salesDeviationSearch)?'':'none')}
const priorServiceRender=render;
render=function(){priorServiceRender();
 if(role==='client'){
  document.getElementById('tabs').style.display='none';
  document.querySelector('.pagehead h1').textContent='My Tickets';
  document.getElementById('content').innerHTML=serviceClient();
 }
 if(role==='tl'&amp;&amp;!tlSelectedProject){
  const t=document.getElementById('tabs');
  t.style.display='flex';t.innerHTML=`&lt;button class=&quot;tab ${serviceTLTab!=='Client Tickets'?'active':''}&quot; onclick=&quot;serviceTLTab='Projects Inbox';render()&quot;&gt;Handover Inbox&lt;/button&gt;&lt;button class=&quot;tab ${serviceTLTab==='Client Tickets'?'active':''}&quot; onclick=&quot;serviceTLTab='Client Tickets';render()&quot;&gt;Client Tickets&lt;/button&gt;`;
  if(serviceTLTab==='Client Tickets')document.getElementById('content').innerHTML=serviceTL();
 }
};

&lt;script&gt;
(function(){
  const oldRenderEmployeeNav=render;
  const oldSwitchEmployeeNav=switchRole;
  const navItems=[['Projects','▣','Projects'],['Assigned Client Tickets','▤','Assigned Client Tickets'],['Deviation Requests','↗','Deviation Requests']];
  function employeeAssignmentData(){
    const assignments=tlProjects.flatMap(p=&gt;getProjectModules(p.id).filter(m=&gt;contributors(m).includes(selectedEmployee)).map(m=&gt;({project:p,module:m})));
    const projCount=new Set(assignments.map(a=&gt;a.project.id)).size;
    const ticketList=(state.tickets||[]).filter(t=&gt;(t.assignments||[]).some(a=&gt;a.name===selectedEmployee));
    const deviations=(state.deviations||[]).filter(d=&gt;d.person===selectedEmployee);
    const logs=(state.logs||[]).filter(l=&gt;l.person===selectedEmployee);
    const ticketLogs=ticketList.flatMap(t=&gt;(t.worklogs||[]).filter(l=&gt;l.employee===selectedEmployee));
    const hours=logs.reduce((sum,l)=&gt;sum+(+l.hours||0),0)+ticketLogs.reduce((sum,l)=&gt;sum+(+l.hours||0),0);
    const activeTasks=assignments.filter(a=&gt;a.module.state!=='Completed').length;
    return {assignments,projCount,ticketList,deviations,logs,ticketLogs,hours,activeTasks};
  }
  function navigateEmployeeNav(target){
    employeeSelectedProject=null;
    if(target==='Projects')tab='My Work';else tab=target;
    render();
  }
  window.employeeNavigate=navigateEmployeeNav;
  function buildSidebar(){
    let side=document.getElementById('employee-side-navigation');
    if(!side){side=document.createElement('aside');side.id='employee-side-navigation';side.className='employee-sidebar';document.body.appendChild(side)}
    const data=employeeAssignmentData();
    const badgeCounts={'Projects':data.projCount,'Assigned Client Tickets':data.ticketList.length,'Deviation Requests':data.deviations.filter(d=&gt;d.status.startsWith('Pending')).length};
    const current=tab==='My Work'?'Projects':tab;
    side.innerHTML=`&lt;div class=&quot;side-title&quot;&gt;Employee Workspace&lt;/div&gt;${navItems.map(([name,icon,dest])=&gt;`&lt;button class=&quot;side-link ${current===name?'is-active':''}&quot; onclick=&quot;employeeNavigate('${dest}')&quot;&gt;&lt;span class=&quot;side-icon&quot;&gt;${icon}&lt;/span&gt;&lt;span class=&quot;side-label&quot;&gt;${name}&lt;/span&gt;${badgeCounts[name]!==undefined?`&lt;span class=&quot;side-badge&quot;&gt;${badgeCounts[name]}&lt;/span&gt;`:''}&lt;/button&gt;`).join('')}`;
  }
  function kpi(value,label,target){return `&lt;button class=&quot;employee-kpi-card&quot; onclick=&quot;employeeNavigate('${target}')&quot;&gt;&lt;span class=&quot;desc&quot;&gt;${label}&lt;span class=&quot;kpi-arrow&quot;&gt;↗&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;big&quot;&gt;${value}&lt;/span&gt;&lt;span class=&quot;desc&quot;&gt;Open ${target==='Dashboard'?'dashboard':target.toLowerCase()}&lt;/span&gt;&lt;/button&gt;`}
  function dashboardHTML(){
    const d=employeeAssignmentData();
    let moduleHours=d.logs.reduce((sum,l)=&gt;sum+(+l.hours||0),0);
    let ticketHours=d.ticketLogs.reduce((sum,l)=&gt;sum+(+l.hours||0),0);
    let pending=d.deviations.filter(x=&gt;x.status.startsWith('Pending')).length;
    const moduleRows=d.assignments.slice(0,6).map(({project:p,module:m})=&gt;{
      const myLogs=d.logs.filter(l=&gt;l.module===m.id), actual=myLogs.reduce((s,l)=&gt;s+(+l.hours||0),0), last=myLogs[myLogs.length-1];
      return `&lt;tr&gt;&lt;td&gt;${esc(p.client)}&lt;/td&gt;&lt;td&gt;${esc(m.name)}&lt;/td&gt;&lt;td&gt;${m.hours||0}h &lt;small&gt;(module)&lt;/small&gt;&lt;/td&gt;&lt;td&gt;${actual}h&lt;/td&gt;&lt;td&gt;${pill(last?.status||m.state)}&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;mini&quot; onclick=&quot;employeeSelectedProject='${p.id}';tab='My Work';render()&quot;&gt;Open&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;`;
    }).join('');
    return `&lt;div class=&quot;employee-overview-title&quot;&gt;&lt;h2&gt;My Work – Overall Dashboard&lt;/h2&gt;&lt;div&gt;&lt;label class=&quot;helper&quot; for=&quot;employee-dash-select&quot;&gt;Employee &amp;nbsp;&lt;/label&gt;&lt;select id=&quot;employee-dash-select&quot; onchange=&quot;selectedEmployee=this.value;employeeSelectedProject=null;render()&quot;&gt;${employees.map(n=&gt;`&lt;option ${n===selectedEmployee?'selected':''} value=&quot;${esc(n)}&quot;&gt;${esc(n)}&lt;/option&gt;`).join('')}&lt;/select&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;employee-kpi-grid&quot;&gt;
       ${kpi(d.projCount,'Assigned Projects','Projects')}
       ${kpi(d.assignments.length,'Assigned Project Modules','Projects')}
       ${kpi(d.ticketList.length,'Assigned Client Tickets','Assigned Client Tickets')}
       ${kpi(d.deviations.length,'Total Deviation Requests','Deviation Requests')}
       ${kpi(moduleHours+'h','Project Work Hours Logged','Projects')}
       ${kpi(ticketHours+'h','Client Ticket Hours Logged','Assigned Client Tickets')}
       ${kpi(pending,'Pending Deviations','Deviation Requests')}
      &lt;/div&gt;
      &lt;div class=&quot;employee-dashboard-block panel card&quot;&gt;&lt;div class=&quot;action-row&quot;&gt;&lt;h3&gt;Recent Project Assignments&lt;/h3&gt;&lt;button class=&quot;mini&quot; onclick=&quot;employeeNavigate('Projects')&quot;&gt;View All Projects&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Company&lt;/th&gt;&lt;th&gt;Module&lt;/th&gt;&lt;th&gt;Estimated&lt;/th&gt;&lt;th&gt;My Actual&lt;/th&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Action&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${moduleRows||'&lt;tr&gt;&lt;td colspan=&quot;6&quot;&gt;No modules assigned yet.&lt;/td&gt;&lt;/tr&gt;'}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;employee-dashboard-block panel card&quot;&gt;&lt;div class=&quot;action-row&quot;&gt;&lt;h3&gt;Assigned Client Tickets&lt;/h3&gt;&lt;button class=&quot;mini&quot; onclick=&quot;employeeNavigate('Assigned Client Tickets')&quot;&gt;View All Tickets&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Ticket ID&lt;/th&gt;&lt;th&gt;Company&lt;/th&gt;&lt;th&gt;Subject&lt;/th&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Action&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${d.ticketList.slice(0,5).map(t=&gt;`&lt;tr&gt;&lt;td&gt;${esc(t.id)}&lt;/td&gt;&lt;td&gt;${esc(t.client)}&lt;/td&gt;&lt;td&gt;${esc(t.subject)}&lt;/td&gt;&lt;td&gt;${pill(t.status)}&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;mini&quot; onclick=&quot;serviceEmployee=selectedEmployee;serviceOpen('${t.id}','employee')&quot;&gt;Open Ticket&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;`).join('')||'&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;No client tickets assigned yet.&lt;/td&gt;&lt;/tr&gt;'}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;`;
  }
  render=function(){
    if(role==='employee'){
      document.body.classList.add('employee-nav-active');
      if(!['My Work','Projects','Deviation Requests','Assigned Client Tickets'].includes(tab))tab='My Work';
      if(tab==='Projects')tab='My Work';
      if(tab==='Dashboard'){
        tab='My Work';oldRenderEmployeeNav.call(window); // initialize existing employee layout
        tab='Dashboard';document.getElementById('content').innerHTML=dashboardHTML();
      }else{
        if(tab==='Assigned Client Tickets')serviceEmployee=selectedEmployee;
        oldRenderEmployeeNav.call(window);
      }
      document.querySelector('.pagehead h1').textContent=tab==='Dashboard'?'My Work':tab==='My Work'?'Projects':tab;
      document.querySelector('.crumb').textContent='⌂  Home / Project Management / Employee Workspace';
      document.querySelector('.pagehead button').style.display='none';
      document.querySelector('.project').style.display='none';
      document.getElementById('tabs').style.display='none';
      buildSidebar();
    }else{
      document.body.classList.remove('employee-nav-active');
      const side=document.getElementById('employee-side-navigation');if(side)side.remove();
      oldRenderEmployeeNav.call(window);
    }
  };
  switchRole=function(v){oldSwitchEmployeeNav.call(window,v);if(v==='employee'){tab='My Work';employeeSelectedProject=null;render()}};
  // Keep the default IT Team Lead opening screen unchanged.
  render();
})();
&lt;/script&gt;

&lt;script&gt;
/* Additive role-scoped history: does not change assignment or timekeeping data. */
(function(){
  const previousAuditRender=render;
  const previousAuditSwitch=switchRole;
  const oldReviewDeviation=reviewDeviation;
  let auditModuleFilter='all';
  function fullProjectLabel(id){const p=tlProjects.find(p=&gt;p.id===id);return p?(p.client+' / '+p.name):id}
  function findScopeProject(id){return tlProjects.find(p=&gt;getProjectModules(p.id).some(m=&gt;m.id===id))}
  function logTable(records){
    const rows=(records||[]).slice(0,100);
    return `&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th style=&quot;width:165px&quot;&gt;When / Date&lt;/th&gt;&lt;th style=&quot;width:185px&quot;&gt;Action&lt;/th&gt;&lt;th&gt;Record / Details&lt;/th&gt;&lt;th style=&quot;width:155px&quot;&gt;Performed By&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows.map(x=&gt;`&lt;tr&gt;&lt;td&gt;${esc(x.when||'—')}&lt;/td&gt;&lt;td&gt;&lt;b&gt;${esc(x.action)}&lt;/b&gt;&lt;/td&gt;&lt;td&gt;${esc(x.description)}&lt;/td&gt;&lt;td&gt;${esc(x.actor||'—')}&lt;/td&gt;&lt;/tr&gt;`).join('')||'&lt;tr&gt;&lt;td colspan=&quot;4&quot; class=&quot;empty-audit&quot;&gt;No activity recorded yet for this workspace.&lt;/td&gt;&lt;/tr&gt;'}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;
  }
  function historyCard(title,items,description=''){
    return `&lt;section class=&quot;panel card module-audit-panel&quot;&gt;&lt;div class=&quot;audit-heading&quot;&gt;&lt;div&gt;&lt;h3&gt;${esc(title)}&lt;/h3&gt;${description?`&lt;div class=&quot;audit-sub&quot;&gt;${esc(description)}&lt;/div&gt;`:''}&lt;/div&gt;&lt;span class=&quot;pill&quot;&gt;${items.length} Records&lt;/span&gt;&lt;/div&gt;${logTable(items)}&lt;/section&gt;`;
  }
  function eventRecords(filter){return (state.events||[]).filter(filter).map(e=&gt;({when:e.when,action:e.action,description:e.description,actor:({tl:'IT Team Lead',employee:'Developer / Tester',sales:'IT Sales Head',client:'Client Service Desk',pm:'Project Management'})[e.who]||e.who}));}
  function tlHistory(){
    let selected=tlSelectedProject?activeTLProject():null;
    let modules=selected?getProjectModules(selected.id):[];
    let ids=modules.map(m=&gt;m.id);
    let events=eventRecords(e=&gt;{
      if(!selected)return e.who==='tl';
      const d=String(e.description||'');
      return d.includes(selected.id)||ids.some(id=&gt;d.includes(id))||(selected.id==='PRJ-2026-07'&amp;&amp;e.who==='tl'&amp;&amp;/handover|module|assignment|development/i.test(e.action));
    });
    let logs=(state.logs||[]).filter(l=&gt;!selected||ids.includes(l.module)).map(l=&gt;({when:l.date,action:'Daily work logged',description:`${l.module} · ${l.hours}h · ${l.progress}% · ${l.work}${l.blocker?' · Blocked: '+l.blocker:''}`,actor:l.person}));
    let deviations=(state.deviations||[]).filter(d=&gt;!selected||d.project===selected.id).map(d=&gt;({when:d.created,action:'Deviation '+d.status,description:`${d.id} · ${d.module} · ${d.oldhours}h → ${d.newhours}h · ${d.reason}${d.remark?' · Decision remarks: '+d.remark:''}`,actor:d.person}));
    return historyCard(selected?'Project &amp; Module Activity Log':'IT Handover &amp; Assignment Activity Log', [...events,...logs,...deviations], 'Handover, module assignments, work logs and deviation decisions');
  }
  function employeeHistory(){
    let project=employeeSelectedProject;
    let projectModules=project?getProjectModules(project).map(m=&gt;m.id):null;
    let logs=(state.logs||[]).filter(l=&gt;l.person===selectedEmployee&amp;&amp;(!projectModules||projectModules.includes(l.module))).map(l=&gt;({when:l.date,action:'Project work logged',description:`${l.module} · ${l.hours}h · ${l.progress}% · ${l.work}${l.blocker?' · Blocker: '+l.blocker:''}`,actor:l.person}));
    let deviations=(state.deviations||[]).filter(d=&gt;d.person===selectedEmployee&amp;&amp;(!project||d.project===project)).flatMap(d=&gt;[
      {when:d.created,action:'Deviation submitted',description:`${d.id} · ${d.module} · ${d.oldhours}h → ${d.newhours}h · ${d.reason}`,actor:selectedEmployee},
      ...(d.decidedAt?[{when:d.decidedAt,action:'Deviation '+d.status,description:`${d.id} · ${d.remark||'No remarks'}`,actor:d.decidedBy||'IT Sales Head'}]:[])
    ]);
    let tickets=(state.tickets||[]).filter(t=&gt;(t.assignments||[]).some(a=&gt;a.name===selectedEmployee));
    let ticketLogs=tickets.flatMap(t=&gt;(t.worklogs||[]).filter(l=&gt;l.employee===selectedEmployee).map(l=&gt;({when:l.date,action:'Client ticket work logged',description:`${t.id} · ${t.client} · ${l.hours}h · ${l.progress}% · ${l.remarks}`,actor:l.employee})));
    const tabScope=tab==='Assigned Client Tickets'?ticketLogs:tab==='Deviation Requests'?deviations:tab==='My Work'?[...logs,...deviations]:[...logs,...ticketLogs,...deviations];
    return historyCard('My Activity Log',tabScope,'Only the selected employee’s project work, client ticket work and deviations');
  }
  function salesHistory(){
    const records=(state.deviations||[]).flatMap(d=&gt;[
      {when:d.created,action:'Deviation request received',description:`${d.id} · ${fullProjectLabel(d.project)} · ${d.module} · ${d.person} · ${d.oldhours}h → ${d.newhours}h`,actor:d.person},
      ...(d.decidedAt?[{when:d.decidedAt,action:d.status,description:`${d.id} · ${fullProjectLabel(d.project)} · ${d.remark||''}`,actor:d.decidedBy||'IT Sales Head'}]:[])
    ]);
    return historyCard('Deviation Approval Activity Log',records,'All submissions and decisions remain visible after approval or rejection');
  }
  function ticketHistory(tickets,actor){
    return tickets.flatMap(t=&gt;{
      const base=[{when:t.date,action:'Ticket raised',description:`${t.id} · ${t.subject} · ${t.type}`,actor:'Client Service Desk'}];
      const notes=(t.notes||[]).map(n=&gt;({when:'—',action:'Ticket activity',description:`${t.id} · ${n}`,actor:'Service Desk / IT Team'}));
      const work=(t.worklogs||[]).map(l=&gt;({when:l.date,action:'Ticket work logged',description:`${t.id} · ${l.hours}h · ${l.progress}% · ${l.remarks}`,actor:l.employee}));
      return [...base,...notes,...work];
    });
  }
  function clientHistory(){return historyCard('My Ticket Activity Log',ticketHistory((state.tickets||[]).filter(t=&gt;t.client===serviceProject.client)),'Updates on tickets raised by this client');}
  function tlTicketHistory(){return historyCard('Client Ticket Activity Log',ticketHistory(state.tickets||[]),'Ticket classification, assignment, work updates and closure history');}

  function deliveryModuleTable(mods){return `&lt;div class=&quot;tablewrap&quot;&gt;&lt;table class=&quot;delivery-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Module / Priority&lt;/th&gt;&lt;th&gt;Lead &amp; Contributors&lt;/th&gt;&lt;th&gt;Estimated&lt;/th&gt;&lt;th&gt;Actual&lt;/th&gt;&lt;th&gt;Variance&lt;/th&gt;&lt;th&gt;Employee Update / Status&lt;/th&gt;&lt;th&gt;Deadline&lt;/th&gt;&lt;th&gt;TL Action&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${mods.map(m=&gt;{const a=moduleHours(m),v=a-(+m.hours||0),logs=(state.logs||[]).filter(l=&gt;l.module===m.id),latest=logs[logs.length-1],contributorsList=contributors(m);return `&lt;tr&gt;&lt;td&gt;&lt;b&gt;${esc(m.name)}&lt;/b&gt;&lt;div class=&quot;delivery-meta&quot;&gt;${esc(m.id)} · ${esc(m.priority)} · ${m.weight}%&lt;/div&gt;&lt;/td&gt;&lt;td&gt;${esc(m.lead||'Unassigned')}&lt;div class=&quot;delivery-meta&quot;&gt;${contributorsList.length} contributor(s): ${esc(contributorsList.join(', ')||'—')}&lt;/div&gt;&lt;/td&gt;&lt;td&gt;${+m.hours||0}h&lt;/td&gt;&lt;td&gt;&lt;b&gt;${a}h&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;${v&gt;0?'variance-bad':v&lt;0?'variance-good':'variance-neutral'}&quot;&gt;${(+m.hours||0)===0?'Not estimated':v&gt;0?'+'+v+'h over':v&lt;0?Math.abs(v)+'h remaining':'On estimate'}&lt;/span&gt;&lt;/td&gt;&lt;td&gt;${pill(stageFromModule(m))}&lt;div class=&quot;delivery-meta&quot;&gt;Latest: ${latest?esc(latest.person)+' · '+latest.progress+'% · '+esc(latest.date):'No work logged'}&lt;/div&gt;&lt;/td&gt;&lt;td&gt;${esc(m.deadline||'—')}&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;mini&quot; onclick=&quot;openDeliveryModule('${esc(m.id)}')&quot;&gt;Review&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;`}).join('')||'&lt;tr&gt;&lt;td colspan=&quot;8&quot;&gt;No modules defined.&lt;/td&gt;&lt;/tr&gt;'}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`}
  function openDeliveryModule(id){const match=findModuleAcrossProjects(id);if(!match)return;const m=match.module,logs=(state.logs||[]).filter(l=&gt;l.module===id),a=moduleHours(m),openDevs=(state.deviations||[]).filter(d=&gt;d.module===id);modal(`&lt;div class=&quot;modalhead&quot;&gt;&lt;h3&gt;Team Lead Review · ${esc(m.name)}&lt;/h3&gt;&lt;button onclick=&quot;closeModal()&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;&lt;div class=&quot;soft&quot;&gt;&lt;b&gt;Estimated Hours&lt;/b&gt;&lt;div&gt;${m.hours||0}h&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;soft&quot;&gt;&lt;b&gt;Actual Hours&lt;/b&gt;&lt;div&gt;${a}h&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;soft&quot;&gt;&lt;b&gt;Module Deadline&lt;/b&gt;&lt;div&gt;${esc(m.deadline||'—')}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;soft&quot;&gt;&lt;b&gt;Current Status&lt;/b&gt;&lt;div&gt;${pill(m.state)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;h4&gt;Individual Employee Contributions&lt;/h4&gt;&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Employee&lt;/th&gt;&lt;th&gt;Hours&lt;/th&gt;&lt;th&gt;Progress (individual)&lt;/th&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Remarks / Blockers&lt;/th&gt;&lt;/tr&gt;${logs.map(l=&gt;`&lt;tr&gt;&lt;td&gt;${esc(l.date)}&lt;/td&gt;&lt;td&gt;${esc(l.person)}&lt;/td&gt;&lt;td&gt;${l.hours}h&lt;/td&gt;&lt;td&gt;${l.progress}%&lt;/td&gt;&lt;td&gt;${pill(l.status)}&lt;/td&gt;&lt;td&gt;${esc(l.work)}${l.blocker?'&lt;div class=&quot;variance-bad&quot;&gt;'+esc(l.blocker)+'&lt;/div&gt;':''}&lt;/td&gt;&lt;/tr&gt;`).join('')||'&lt;tr&gt;&lt;td colspan=&quot;6&quot;&gt;No work logs yet&lt;/td&gt;&lt;/tr&gt;'}&lt;/table&gt;&lt;/div&gt;&lt;h4&gt;Deviation Requests&lt;/h4&gt;${openDevs.length?openDevs.map(d=&gt;`&lt;div class=&quot;stub&quot;&gt;&lt;span&gt;${esc(d.id)} · ${esc(d.person)} · ${pill(d.status)}&lt;/span&gt;&lt;small&gt;${esc(d.reason)}&lt;/small&gt;&lt;/div&gt;`).join(''):'&lt;div class=&quot;helper&quot;&gt;No   development=function(){if(role!=='tl')return beforeDevelopment();const p=deliveryProject(),mods=deliveryModules(),logs=deliveryLogs(mods);return `&lt;div class=&quot;panel card&quot;&gt;&lt;div class=&quot;statusline&quot;&gt;&lt;div&gt;&lt;h3&gt;Development – Team Lead Monitoring&lt;/h3&gt;&lt;div class=&quot;helper&quot;&gt;${esc(p.id)} · ${esc(p.name)} · ${esc(p.client)}&lt;/div&gt;&lt;/div&gt;&lt;button onclick=&quot;tab='UAT';render()&quot;&gt;Open UAT →&lt;/button&gt;&lt;/div&gt;${deliveryStages(mods)}${deliveryKpi(mods)}&lt;/div&gt;&lt;div class=&quot;panel card&quot;&gt;&lt;div class=&quot;statusline&quot;&gt;&lt;h3&gt;Module-wise Development &amp; Verification&lt;/h3&gt;&lt;span class=&quot;helper&quot;&gt;Employee updates are read-only; Team Lead verifies module status.&lt;/span&gt;&lt;/div&gt;${deliveryModuleTable(mods)}&lt;/div&gt;&lt;div class=&quot;panel card&quot;&gt;&lt;h3&gt;Individual Work Log – All Contributors&lt;/h3&gt;&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Date&lt;/th&gt;&lt;th&gt;Module&lt;/th&gt;&lt;th&gt;Employee&lt;/th&gt;&lt;th&gt;Hours&lt;/th&gt;&lt;th&gt;Individual Progress&lt;/th&gt;&lt;th&gt;Work Stage&lt;/th&gt;&lt;th&gt;Remarks / Blockers&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${[...logs].reverse().map(l=&gt;`&lt;tr&gt;&lt;td&gt;${esc(l.date)}&lt;/td&gt;&lt;td&gt;${esc(findModuleAcrossProjects(l.module)?.module.name||l.module)}&lt;/td&gt;&lt;td&gt;${esc(l.person)}&lt;/td&gt;&lt;td&gt;${l.hours}h&lt;/td&gt;&lt;td&gt;${l.progress}%&lt;/td&gt;&lt;td&gt;${pill(l.status)}&lt;/td&gt;&lt;td&gt;${esc(l.work)}${l.blocker?'&lt;div class=&quot;variance-bad&quot;&gt;'+esc(l.blocker)+'&lt;/div&gt;':''}&lt;/td&gt;&lt;/tr&gt;`).join('')||'&lt;tr&gt;&lt;td colspan=&quot;7&quot; class=&quot;empty&quot;&gt;No employee work updates yet.&lt;/td&gt;&lt;/tr&gt;'}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;`};

 &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;`;

function projectResourceUsage(projectId,candidate){
 let modules=getProjectModules(projectId),selected=modules.map(m=&gt;m.id===candidate.id?candidate:m);
 const unique=fn=&gt;new Set(selected.flatMap(fn).filter(Boolean));
 let developers=unique(m=&gt;[m.lead,...(m.support||[])]),testers=unique(m=&gt;m.testers||[]),coordinators=unique(m=&gt;[m.coordinator]),designers=unique(m=&gt;m.designers||[]);
 return {developers:developers.size,testers:testers.size,coordinators:coordinators.size,designers:designers.size};
}

 for(const key of Object.keys(limits))if(used[key]&gt;limits[key])return `Cannot assign ${used[key]} distinct ${key}. The approved Opportunity estimate allows only ${limits[key]} for this project. Request a resource-plan revision first.`;
 return '';

function startTimedWork(kind,id,employee){
 if(Object.values(state.activeTimers).some(s=&gt;s.employee===employee)){alert('You already have a running work session. Stop it before starting another.');return}

function stopTimedWork(kind,id,employee){

 if(status==='Blocked'&amp;&amp;!blocker){showSessionError('Please enter a blocker / delay reason for Blocked status.');return}

 if(kind==='module'){
   state.logs.push({id:'WL-'+Date.now(),module:id,date,person:employee,hours,seconds,startedAt:session.startedAt,endedAt:end,progress,status,work:remarks,blocker,source:'timer'});

 }else{

 }

   const header=refreshed.querySelector('.modalhead');if(header)header.insertAdjacentElement('afterend',msg);else refreshed.prepend(msg);
   const history=refreshed.querySelector('.session-history-board')||refreshed.querySelector('.session-board:last-child');

}
